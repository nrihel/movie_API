<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>results</title>
    <link rel="stylesheet" href="moviestyle.css">
    <script src="https://kit.fontawesome.com/a72164c063.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
</head>
<body>
    <div class="nav">
        <figure>
            <img class="logo" src="movie logo.svg">
        </figure>
        <ul class="nav__links">
            <a href="/index.html" class="link 
            link__hover-effect
            link__hover-effect--white">Home</a>
            <a href="#" class="link 
            link__hover-effect 
            link__hover-effect--white">Search</a>
        </ul>
    </div>
    <div class="movie__search">
        <a href="./index.html">
        <button class="btn__back">← Back</button>
        </a>
        <input type="text" id="Title" placeholder="Search by Title" onchange="main()">
        </div>
    </div>
    <div class="sort">
            <select id="filter" onchange="filterMovie(event)">
              <option value="" disabled selected>Sort</option>
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>        
            </select>
    </div>
    <div class="container">
        <div class="row">
            <div class="movie-list">
                <div class="movie">
                    <div class="movie-card">
                        <div class="movie-card__container">
                            <h3>Movie Title</h3>
                            <p>Release Date: </p>
                            <img src="" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>
  </div>
</body>
<footer>
        <p>&copy;Nick Rihel 2026
        </p>
    </footer>        
</html>
